<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Content Management - Socmedata</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div class="dashboard-container">


<h1>
Content Management
</h1>


<p id="profileName">
Loading profile...
</p>


<button id="addContentBtn">

    + Create Content

</button>


<!-- =====================================
     CONTENT TOOLBAR
===================================== -->

<div class="content-toolbar">


    <input
        type="text"
        id="searchContent"
        placeholder="🔍 Search content..."
    >


    <select id="statusFilter">

        <option value="all">
            All Status
        </option>

        <option value="draft">
            Draft
        </option>

        <option value="scheduled">
            Scheduled
        </option>

        <option value="published">
            Published
        </option>

    </select>


    <select id="platformFilter">

        <option value="all">
            All Platforms
        </option>

        <option value="Instagram">
            Instagram
        </option>

        <option value="TikTok">
            TikTok
        </option>

        <option value="YouTube">
            YouTube
        </option>

        <option value="Facebook">
            Facebook
        </option>

        <option value="X">
            X
        </option>

        <option value="Threads">
            Threads
        </option>

    </select>


</div>



<!-- =====================================
     CONTENT LIST
===================================== -->

<div class="content-box">


    <h2>
        My Content
    </h2>


    <div id="contentList">

        <p>
            No content yet
        </p>

    </div>


</div>



<!-- =====================================
     CONTENT MODAL
===================================== -->

<div
    id="contentModal"
    class="modal"
>


    <div class="modal-content">


        <!-- MODAL HEADER -->

        <div class="modal-header">


            <h2 id="contentModalTitle">
                Create Content
            </h2>


            <span
                id="closeContentModal"
                class="close"
            >

                &times;

            </span>


        </div>



        <!-- MODAL BODY -->

        <div class="modal-body">



            <!-- TITLE -->

            <label>
                Title
            </label>


            <input
                type="text"
                id="contentTitle"
                placeholder="Enter content title"
            >



            <!-- PLATFORM -->

            <label>
                Platform
            </label>


            <select id="contentPlatform">

                <option value="Instagram">
                    Instagram
                </option>

                <option value="Facebook">
                    Facebook
                </option>

                <option value="TikTok">
                    TikTok
                </option>

                <option value="YouTube">
                    YouTube
                </option>

                <option value="Threads">
                    Threads
                </option>

                <option value="X">
                    X
                </option>

            </select>



            <!-- CONTENT TYPE -->

            <label>
                Content Type
            </label>


            <select id="contentType">

                <option value="Post">
                    Post
                </option>

                <option value="Reel">
                    Reel
                </option>

                <option value="Story">
                    Story
                </option>

                <option value="Carousel">
                    Carousel
                </option>

                <option value="Video">
                    Video
                </option>

                <option value="Short">
                    Short
                </option>

                <option value="Live">
                    Live
                </option>

            </select>



            <!-- STATUS -->

            <label>
                Status
            </label>


            <select id="contentStatus">

                <option value="Draft">
                    Draft
                </option>

                <option value="Scheduled">
                    Scheduled
                </option>

                <option value="Published">
                    Published
                </option>

                <option value="Archived">
                    Archived
                </option>

            </select>



            <!-- DATE -->

            <label>
                Publish Date
            </label>


            <input
                type="date"
                id="contentDate"
            >



            <!-- CAPTION -->

            <label>
                Caption
            </label>


            <textarea
                id="contentCaption"
                rows="5"
                placeholder="Write your caption..."
            ></textarea>



            <!-- HASHTAGS -->

            <label>
                Hashtags
            </label>


            <input
type="text"
id="contentHashtag"
placeholder="#marketing #instagram"
>



            <!-- IMPRESSIONS -->

            <label>
                Impressions
            </label>


            <input
                type="number"
                id="contentImpressions"
                placeholder="Total impressions"
                min="0"
            >



            <!-- REACH -->

            <label>
                Reach
            </label>


            <input
                type="number"
                id="contentReach"
                placeholder="Total people reached"
                min="0"
            >



            <!-- LIKES -->

            <label>
                Likes
            </label>


            <input
                type="number"
                id="contentLikes"
                placeholder="Total likes"
                min="0"
            >



            <!-- COMMENTS -->

            <label>
                Comments
            </label>


            <input
                type="number"
                id="contentComments"
                placeholder="Total comments"
                min="0"
            >



            <!-- SHARES -->

            <label>
                Shares
            </label>


            <input
                type="number"
                id="contentShares"
                placeholder="Total shares"
                min="0"
            >



            <!-- SAVED -->

            <label>
                Saves
            </label>


            <input
                type="number"
                id="contentSaved"
                placeholder="Total saves"
                min="0"
            >



            <!-- NOTES -->

            <label>
                Notes
            </label>


            <textarea
                id="contentNotes"
                rows="4"
                placeholder="Internal notes..."
            ></textarea>



            <!-- BUTTONS -->

            <div class="modal-buttons">


                <button
                    type="button"
                    id="cancelContent"
                >

                    Cancel

                </button>


                <button
                    type="button"
                    id="saveContent"
                >

                    Create Content

                </button>


            </div>


        </div>


    </div>


</div>



</div>



<script src="../js/content.js"></script>


</body>

</html>
