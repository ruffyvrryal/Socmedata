<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Socmedata - Login</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >
</head>

<body>

    <main>

        <h1>Socmedata</h1>

        <p>Your Social Media Content Vault</p>

        <section>

            <h2>Login</h2>

            <form id="loginForm">

                <div>
                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        required
                    >
                </div>

                <div>
                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        required
                    >
                </div>

                <button
                    type="submit"
                    id="loginButton"
                >
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

            <hr>

            <h2>Create Account</h2>

            <form id="registerForm">

                <div>
                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        required
                    >
                </div>

                <div>
                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        minlength="6"
                        required
                    >
                </div>

                <button
                    type="submit"
                    id="registerButton"
                >
                    Create Account
                </button>

            </form>

            <p id="registerMessage"></p>

        </section>

    </main>


    <script
        type="module"
        src="../js/auth.js"
    ></script>

</body>

</html>
