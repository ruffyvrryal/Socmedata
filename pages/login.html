<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Socmedata - Login</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >
</head>

<body class="auth-page">

    <main class="auth-container">

        <!-- =====================================
             BRAND
        ====================================== -->

        <header class="auth-brand">

            <h1>Socmedata</h1>

            <p>Your Social Media Content Vault</p>

        </header>


        <!-- =====================================
             AUTH CARD
        ====================================== -->

        <section class="auth-card">


            <!-- =================================
                 LOGIN
            ================================== -->

            <div class="auth-panel">

                <div class="auth-heading">

                    <span class="auth-eyebrow">
                        WELCOME BACK
                    </span>

                    <h2>
                        Sign in to your vault
                    </h2>

                    <p>
                        Manage your social media content
                        from one place.
                    </p>

                </div>


                <form id="loginForm">

                    <div class="auth-field">

                        <label for="loginEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="auth-field">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        id="loginButton"
                        class="auth-button"
                    >
                        Login
                    </button>

                </form>


                <p
                    id="loginMessage"
                    class="auth-message"
                ></p>


                <div class="auth-divider">

                    <span>New to Socmedata?</span>

                </div>


                <button
                    type="button"
                    class="auth-switch-button"
                    onclick="document.getElementById('registerSection').scrollIntoView({ behavior: 'smooth' })"
                >
                    Create an account
                </button>

            </div>


            <!-- =================================
                 CREATE ACCOUNT
            ================================== -->

            <div
                class="auth-panel auth-register-panel"
                id="registerSection"
            >

                <div class="auth-heading">

                    <span class="auth-eyebrow">
                        GET STARTED
                    </span>

                    <h2>
                        Create your account
                    </h2>

                    <p>
                        Start building your social media
                        content vault.
                    </p>

                </div>


                <form id="registerForm">

                    <div class="auth-field">

                        <label for="registerName">
                            Name
                        </label>

                        <input
                            type="text"
                            id="registerName"
                            placeholder="Enter your name"
                            autocomplete="name"
                            required
                        >

                    </div>


                    <div class="auth-field">

                        <label for="registerEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="auth-field">

                        <label for="registerPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        id="registerButton"
                        class="auth-button"
                    >
                        Create Account
                    </button>

                </form>


                <p
                    id="registerMessage"
                    class="auth-message"
                ></p>

            </div>

        </section>


        <!-- =====================================
             FOOTER
        ====================================== -->

        <footer class="auth-footer">

            <span>
                Socmedata
            </span>

            <span>
                Your Social Media Content Vault
            </span>

        </footer>

    </main>


    <script
        type="module"
        src="../js/auth.js"
    ></script>

</body>

</html>
